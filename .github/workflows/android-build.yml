name: Android release
on:
  push:
    tags: ['v1.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Ключ подписи из Secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Сборка подписанного APK
        env:
          KGP_KEYSTORE: ${{ runner.temp }}/release.jks
          KGP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KGP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KGP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KGP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KGP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KGP_YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          KGP_VK_CLIENT_ID: ${{ secrets.VK_CLIENT_ID }}
          KGP_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintRelease testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kgp-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ runner.temp }}/kgp-${{ github.ref_name }}.apk
          body: |
            APK «Карта городских проблем» ${{ github.ref_name }} — Android 8.0+.
            Установка: скачайте файл, разрешите установку из этого источника и откройте его.
